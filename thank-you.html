<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Your Demo Session - Alli AI</title>
  <meta name="description" content="Schedule your Alli AI demo session. Pick a time that works best for you.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#2563eb',
              dark: '#1e293b',
              yellow: '#facc15',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .gradient-bg {
      background: linear-gradient(135deg, #f0f4ff 0%, #fefce8 50%, #f0f4ff 100%);
    }
  </style>
</head>
<body class="gradient-bg min-h-screen flex flex-col">

  <!-- Header -->
  <header class="w-full py-5 px-6 border-b border-gray-100 bg-white/60 backdrop-blur-sm">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="/"><img src="Alli-AI-logo.svg" alt="Alli AI" class="h-9 sm:h-10"></a>
      <div class="flex items-center gap-4">
        <a href="https://app.alliai.com/"
           class="text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors hidden sm:inline">
          Login
        </a>
        <a href="https://app.alliai.com/"
           class="inline-flex items-center gap-2 bg-brand-blue text-white text-sm font-semibold px-5 py-2.5 rounded-lg hover:bg-blue-700 transition-colors">
          Sign up
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 px-6 py-12 lg:py-16">
    <div class="max-w-5xl mx-auto">
      <h1 class="text-4xl sm:text-5xl lg:text-6xl font-black text-gray-900 tracking-tight text-center mb-10">
        Schedule Your Demo Session
      </h1>

      <!-- HubSpot Meetings Embed -->
      <div class="bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden">
        <div class="meetings-iframe-container" data-src="https://meetings.hubspot.com/alli-ai?embed=true"></div>
        <script type="text/javascript" src="https://static.hsappstatic.net/MeetingsEmbed/ex/MeetingsEmbedCode.js"></script>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-6 px-6 text-center border-t border-gray-100">
    <p class="text-sm text-gray-400">&copy; 2026 Alli AI. All rights reserved.</p>
  </footer>

</body>
</html>
